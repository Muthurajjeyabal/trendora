<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product – Trendora</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="announcement-bar">Free Shipping on Selected Products | Discover What's Trending</div>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Trend<span>ora</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#trending">Trending Now</a></li>
        <li><a href="index.html#categories">Categories</a></li>
        <li><a href="index.html#offers">Offers</a></li>
      </ul>
      <div class="nav-icons">
        <a href="cart.html"><i class="fas fa-shopping-bag"></i><span class="cart-count">0</span></a>
        <a href="admin.html"><i class="fas fa-user"></i></a>
      </div>
    </div>
  </nav>

  <div class="section" style="padding-top:40px;">
    <div id="product-detail" style="display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:start;"></div>
    <div id="related" style="margin-top:80px;"></div>
  </div>

  <a href="#" class="whatsapp-float" onclick="orderViaWhatsApp(); return false;"><i class="fab fa-whatsapp"></i></a>

  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const products = getProducts();
    const product = products.find(p => p.id === id);

    if (!product) {
      document.getElementById('product-detail').innerHTML = '<p>Product not found. <a href="index.html">Go back</a></p>';
    } else {
      document.title = product.name + ' – Trendora';
      document.getElementById('product-detail').innerHTML = `
        <div>
          <img src="${product.image}" alt="${product.name}" style="width:100%; border-radius:16px; background:#fafafa; padding:30px;">
        </div>
        <div>
          <h1 style="font-size:32px; margin-bottom:12px;">${product.name}</h1>
          <div class="price" style="font-size:24px; margin:16px 0;">
            <span class="original-price">${formatPrice(product.originalPrice)}</span>
            <span class="discounted-price" style="font-size:28px;">${formatPrice(product.price)}</span>
            <span class="discount-badge">${product.discount}% OFF</span>
          </div>
          <p style="color:#555; margin-bottom:20px;">${product.description}</p>
          <h3 style="margin:20px 0 10px;">Features</h3>
          <ul style="padding-left:20px; color:#444;">
            ${product.features.map(f => `<li>${f}</li>`).join('')}
          </ul>
          <div style="margin:24px 0; display:flex; align-items:center; gap:12px;">
            <label>Quantity:</label>
            <input type="number" id="qty" value="1" min="1" max="${product.stock}" style="width:70px; padding:8px; border:1px solid #ddd; border-radius:8px;">
          </div>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <button class="btn-primary" onclick="addToCart('${product.id}', parseInt(document.getElementById('qty').value))">Add to Cart</button>
            <button class="btn-secondary" onclick="orderViaWhatsApp('${product.name}', '${formatPrice(product.price)}')">Buy on WhatsApp</button>
          </div>
          <div style="margin-top:30px; padding:16px; background:#f8f8f8; border-radius:12px; font-size:14px;">
            <p><strong>Delivery:</strong> 3-7 days across India</p>
            <p><strong>Return:</strong> 7-day easy return</p>
            <p><strong>Stock:</strong> ${product.stock} available</p>
          </div>
        </div>
      `;

      // Related
      const related = products.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
      if (related.length) {
        document.getElementById('related').innerHTML = `
          <h2 class="section-title">Related Products</h2>
          <div class="product-grid">
            ${related.map(p => `
              <div class="product-card">
                <a href="product.html?id=${p.id}"><img src="${p.image}" alt="${p.name}"></a>
                <div class="product-info">
                  <h3><a href="product.html?id=${p.id}">${p.name}</a></h3>
                  <div class="price"><span class="discounted-price">${formatPrice(p.price)}</span></div>
                  <button class="add-to-cart" onclick="addToCart('${p.id}')">Add to Cart</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }
  </script>
</body>
</html>
